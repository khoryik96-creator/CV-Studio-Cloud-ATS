name: Cloud foundation PostgreSQL
on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify scope policy
        run: python3 .github/ci_scope.py --self-test
      - id: scope
        run: python3 .github/ci_scope.py

  postgres:
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cvcloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CVCLOUD_TEST_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/cvcloud_test
      CVCLOUD_TEST_RUNTIME_DSN: postgresql://cvcloud_runtime:synthetic-runtime-only@127.0.0.1:5432/cvcloud_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cloud.txt
      - run: python -m pip install -r requirements.txt -r requirements-cloud.txt pytest
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --version
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["CVCLOUD_TEST_DSN"]) as c:
              c.execute("CREATE ROLE cvcloud_runtime LOGIN PASSWORD 'synthetic-runtime-only' NOSUPERUSER NOBYPASSRLS")
          PY
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: CVCLOUD_REQUIRE_ONLINE_AUTH_DB=1 CVCLOUD_REQUIRE_BROWSER=1 CVCLOUD_REQUIRE_NATIVE_OCR=1 python -m unittest tests.test_cloud_online_owner tests.test_cloud_online_auth cloud.test_foundation tests.test_cloud_auth_foundation tests.test_cloud_onboarding_api tests.test_cloud_blind_jd_contract tests.test_cloud_account_admin_api tests.test_cloud_provider_admin_api tests.test_cloud_provider_config tests.test_cloud_job_state tests.test_cloud_private_storage tests.test_cloud_ai_budget tests.test_cloud_ai_usage tests.test_cloud_ai_dispatch tests.test_cloud_deepseek tests.test_cloud_ocr_merge tests.test_cloud_native_ocr tests.test_cloud_cv_api tests.test_cloud_cv_runner tests.test_cloud_worker_supervision tests.test_cloud_worker_runtime tests.test_cloud_cv_engine tests.test_cloud_file_extract tests.cloud_ai_secrets tests.cloud_postgres_integration
      - name: Cloud regression coverage on Linux
        if: ${{ needs.scope.outputs.scope == 'cloud' || needs.scope.outputs.scope == 'online' }}
        run: |
          python -m pytest tests/test_cloud_*.py -q
          for fixture in tests/test_cloud_*.js; do
            [ -f "$fixture" ] || continue
            node "$fixture" || exit 1
          done
          python -m compileall -q cloud
          git diff --check
