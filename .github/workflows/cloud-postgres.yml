name: Cloud foundation PostgreSQL
on:
  pull_request:
    branches: [master]
    paths:
      - 'cloud/**'
      - 'tests/test_cloud_*'
      - 'tests/cloud_postgres_integration.py'
      - '.github/workflows/cloud-postgres.yml'
      - 'requirements-cloud.txt'
      - 'tests/cloud_ai_secrets.py'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cvcloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CVCLOUD_TEST_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/cvcloud_test
      CVCLOUD_TEST_RUNTIME_DSN: postgresql://cvcloud_runtime:synthetic-runtime-only@127.0.0.1:5432/cvcloud_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install flask==3.1.3 -r requirements-cloud.txt
      - run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["CVCLOUD_TEST_DSN"]) as c:
              c.execute("CREATE ROLE cvcloud_runtime LOGIN PASSWORD 'synthetic-runtime-only' NOSUPERUSER NOBYPASSRLS")
          PY
      - run: python -m unittest cloud.test_foundation tests.test_cloud_auth_foundation tests.test_cloud_job_state tests.test_cloud_private_storage tests.test_cloud_ai_budget tests.test_cloud_ai_dispatch tests.test_cloud_deepseek tests.cloud_ai_secrets tests.cloud_postgres_integration
