name: Cloud foundation PostgreSQL
on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'cloud/**'
      - 'tests/test_cloud_*'
      - 'tests/cloud_postgres_integration.py'
      - '.github/workflows/cloud-postgres.yml'
      - 'requirements-cloud.txt'
      - 'tests/cloud_ai_secrets.py'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cvcloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CVCLOUD_TEST_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/cvcloud_test
      CVCLOUD_TEST_RUNTIME_DSN: postgresql://cvcloud_runtime:synthetic-runtime-only@127.0.0.1:5432/cvcloud_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-cloud.txt
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --version
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["CVCLOUD_TEST_DSN"]) as c:
              c.execute("CREATE ROLE cvcloud_runtime LOGIN PASSWORD 'synthetic-runtime-only' NOSUPERUSER NOBYPASSRLS")
          PY
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: CVCLOUD_REQUIRE_BROWSER=1 CVCLOUD_REQUIRE_NATIVE_OCR=1 python -m unittest cloud.test_foundation tests.test_cloud_auth_foundation tests.test_cloud_account_admin_api tests.test_cloud_provider_admin_api tests.test_cloud_provider_config tests.test_cloud_job_state tests.test_cloud_private_storage tests.test_cloud_ai_budget tests.test_cloud_ai_dispatch tests.test_cloud_deepseek tests.test_cloud_ocr_merge tests.test_cloud_native_ocr tests.test_cloud_cv_api tests.test_cloud_cv_runner tests.test_cloud_worker_supervision tests.test_cloud_worker_runtime tests.test_cloud_cv_engine tests.test_cloud_file_extract tests.cloud_ai_secrets tests.cloud_postgres_integration
